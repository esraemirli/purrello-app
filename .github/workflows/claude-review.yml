name: Claude review

# Advisory review: posts comments, never blocks the merge. The blocking part is the CI workflow
# (secrets, hardcoded strings, architecture guards, build + tests).
on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review against .agents rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a Kotlin Multiplatform (Compose Multiplatform, Android + iOS) pull request
            for the Purrello app. The PR branch is already checked out.

            First read `AGENTS.md` and the rules it indexes in `.agents/rules/` — they are the standard
            you review against. Then read the diff (`gh pr diff`) and review ONLY the changed lines.

            Report, in this order of importance:

            1. **Leaked secrets** — any API key, token, password, private key, signing config, service-account
               JSON, or credential written in plain text (even in a comment, a test fixture, a TODO or an
               example). Always raise these as an inline comment, say which credential it is and that it must
               be rotated and moved to a secret store / CI secret. This is the highest priority finding.
            2. **Correctness & crashes** — nullability, coroutine cancellation, races between loads,
               unhandled error branches, state that can't be reached or can't be recovered.
            3. **Rule violations** (each with the rule file and section):
               - MVI: every screen ViewModel extends `MviViewModel<State, Event, Effect>`; the only public
                 surface is `state` / `effects` / `onEvent`; navigation leaves as an Effect, never a callback
                 in the ViewModel; anything the user sees is State, never an Effect.
               - `Async<T>` for loaded data — no `isLoading` + `data` + `error` triples, no lost `previous`
                 on refresh failure.
               - Screens are stateless `(state, onEvent, modifier)`; `koinViewModel` / `collectAsStateWithLifecycle`
                 / `ObserveEffects` only in the Route.
               - No user-visible string literals; strings come from `composeResources`. No string concatenation
                 for Turkish suffixes.
               - No Material 3 or raw dp/hex in features — `Purr*` components and `PurrelloTheme` tokens.
               - Feature modules never import another feature; DTOs never leave the data layer.
               - Network calls go through `safeApiCall`; no `try/catch` in ViewModels; errors are `AppResult`/`AppError`.
               - Data-driven UI must match a contract in `docs/api/` — flag DTO fields that no contract documents.
               - Tests: new/changed ViewModels and mappers have `commonTest` coverage (success, error, retry,
                 cancellation) using fakes.
            4. **Test gaps and missing previews** for new screens.

            Rules for your output:
            - Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for findings tied
              to a specific line, one comment per finding, with the fix sketched in a short code block.
            - Use `gh pr comment` once for a summary: what the PR does, blocking findings, nits, and anything
              the human reviewer should check by hand (design fidelity, product behavior).
            - Prefix every finding with its severity: `🔴 blocker`, `🟠 should fix`, `🟡 nit`.
            - Secrets are always `🔴 blocker`.
            - Be specific and short. Don't restate the diff, don't praise, don't repeat a finding the CI checks
              already fail on. If everything looks fine, say so in one line.
            - Write findings in Turkish; keep code, identifiers and rule file names as they are.
            - Only post GitHub comments — don't submit review text as chat messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
